general {
    colors = true
    color_good = "#89ca78"
    color_degraded = "#e5c07b"
    color_bad = "#ef596f"
    interval = 2
}
order += "cpu_usage"
order += "cpu_temperature cpu"
order += "read_file gpu"
order += "memory"
order += "battery all"
order += "tztime local"
cpu_usage { format = "cpu %usage" degraded_threshold = 60 max_threshold = 90 }
cpu_temperature cpu {
    format = "%degrees°C"
    max_threshold = 85
    path = "/sys/devices/platform/coretemp.0/hwmon/hwmon*/temp1_input"
}
# Intel iGPU clock (busy % needs root); hidden if the file doesn't exist
read_file gpu {
    format = "gpu %content MHz"
    format_bad = ""
    path = "/sys/class/drm/card1/gt_cur_freq_mhz"
}
memory { memory_used_method = memavailable format = "ram %used" threshold_degraded = "20%" threshold_critical = "10%" }
battery all {
    format = "%status %percentage %consumption %remaining"
    format_down = ""
    status_chr = "chr"
    status_bat = "bat"
    status_full = "full"
    integer_battery_capacity = true
    last_full_capacity = true
    low_threshold = 15
    threshold_type = "percentage"
}
tztime local { format = "%H:%M " }
