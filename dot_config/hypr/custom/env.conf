# for example: vi nano nvim ...

#env = EDITOR, vim

# ~/.local/bin ahead of /usr/local/bin so exec-once=ambxst resolves to the guard
# wrapper (~/.local/bin/ambxst -> systemctl start ambxst.service, idempotent =
# single instance) instead of the raw /usr/local/bin/ambxst that races the
# service and double-spawns the shell.
env = PATH,$HOME/.local/bin:$PATH
