# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# Cursor
cursor {
    no_hardware_cursors = false
    default_monitor = DP-2
}
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

# Workspace 1's monitor is NOT pinned here any more — it lives in
# monitors.conf, written by ~/.local/bin/set-primary-monitor (Super+Shift+M).
# Hardcoding a monitor name in this shared config meant the laptop, which has
# no DP-2, booted onto workspace 2 instead.
