# This file sources other files in `hyprland` and `custom` folders
# You wanna add your stuff in files in `custom`

# --- Environment variables ---
source=hyprland/env.conf
# hyprlang noerror true
source=custom/env.conf
# hyprlang noerror false

# --- Other vars ---
source=hyprland/variables.conf
# hyprlang noerror true
source=custom/variables.conf
# hyprlang noerror false

# --- Defaults ---
# hyprlang if !dontLoadDefaultExecs
# source=hyprland/execs.conf   # disabled: replaced by Ambxst
# hyprlang endif
# hyprlang if !dontLoadDefaultGeneral
source=hyprland/general.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultRules
source=hyprland/rules.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultColors
source=hyprland/colors.conf
# hyprlang endif
# hyprlang if !dontLoadDefaultKeybinds
# source=hyprland/keybinds.conf   # disabled: Ambxst handles keybinds via axctl
# hyprlang endif

# --- Custom ---
# hyprlang noerror true
source=custom/execs.conf
# hyprlang noerror true
source=custom/general.conf
# hyprlang noerror true
source=custom/rules.conf
# hyprlang noerror true
source=custom/keybinds.conf
# hyprlang noerror false

# --- nwg-displays support ---
source=workspaces.conf
source=monitors.conf

# --- Shell overrides ---
# source=hyprland/shellOverrides/main.conf   # disabled: Ambxst is the new shell

# Ambxst
source = ~/.local/share/ambxst/hyprland.conf

# OVERRIDES
# Down here you can write or source anything that you want to override from Ambxst's settings.
unbind = SUPER, T
bind = SUPER, T, exec, kitty # Override ambxst tmux selector with plain kitty

# Workspace prev/next on the bottom-row pair, by keycode so it follows the
# physical keys across layouts: code:52 = Z(us)/Y(cz), code:53 = X.
# Ambxst's keysym binds break on cz, so drop them first.
unbind = SUPER, Z
unbind = SUPER, X
unbind = SUPER SHIFT, Z
unbind = SUPER SHIFT, X
bind = SUPER, code:52, workspace, -1
bind = SUPER, code:53, workspace, +1
bind = SUPER SHIFT, code:52, workspace, e-1
bind = SUPER SHIFT, code:53, workspace, e+1

