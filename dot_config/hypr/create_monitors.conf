# Written by ~/.local/bin/set-primary-monitor (Super+Shift+M).
# DP-2 (MSI MAG 274CQF, 1440p@180Hz) = primary, at 0x0
# DP-1 (Philips 24M1N3200Z, 1080p@165Hz) = secondary, to the right
# DP-1 sits at y=180 so it is vertically CENTRED against DP-2: (1440-1080)/2 = 180
monitor=DP-2,2560x1440@180,0x0,1.0
monitor=DP-1,1920x1080@165,2560x180,1.0
# Workspace 1 follows the primary monitor, so it lands on the big screen at login.
workspace = 1, monitor:DP-2, default:true
